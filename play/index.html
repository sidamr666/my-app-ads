":"دریافت از Google Play","none":"هنوز Chess Meet ندارید؟"},"hi":{"pt":"आपको शतरंज के एक मैच का न्योता मिला है","pb":"एक दोस्त बोर्ड पर आपका इंतज़ार कर रहा है। मैच Chess Meet में खोलें।","ut":"आइए Chess Meet पर शतरंज खेलें","ub":"इस खिलाड़ी की प्रोफ़ाइल Chess Meet में खोलें, उन्हें जोड़ें और खेलें।","open":"Chess Meet में खोलें","get":"Google Play पर पाएं","none":"अभी तक Chess Meet नहीं है?"},"vi":{"pt":"Bạn được mời chơi một ván cờ vua","pb":"Một người bạn đang chờ bạn bên bàn cờ. Hãy mở ván cờ trong Chess Meet.","ut":"Cùng chơi cờ vua trên Chess Meet","ub":"Mở hồ sơ của người chơi này trong Chess Meet để kết bạn và chơi.","open":"Mở trong Chess Meet","get":"Tải trên Google Play","none":"Chưa có Chess Meet?"},"zh":{"pt":"有人邀请你下一盘国际象棋","pb":"朋友正在棋盘前等你。在 Chess Meet 中打开这盘棋。","ut":"来 Chess Meet 下国际象棋吧","ub":"在 Chess Meet 中打开这位棋手的主页，加为好友并开始对局。","open":"在 Chess Meet 中打开","get":"在 Google Play 上获取","none":"还没有 Chess Meet？"},"az":{"pt":"Sizi şahmat oyununa dəvət edirlər","pb":"Dostunuz taxtanın başında sizi gözləyir. Oyunu Chess Meet-də açın.","ut":"Gəlin Chess Meet-də şahmat oynayaq","ub":"Bu oyunçunun profilini Chess Meet-də açın, əlavə edin və oynayın.","open":"Chess Meet-də aç","get":"Google Play-dən əldə edin","none":"Hələ Chess Meet yoxdur?"}};
  var kind = 'play';

  var q = new URLSearchParams(location.search);

  var id = kind === 'play' ? q.get('g') : q.get('id');
  var inviter = kind === 'play' ? q.get('i') : q.get('id');

  // The reader's language, from the browser's list; English otherwise.
  var lang = 'en';
  var wanted = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (var i = 0; i < wanted.length; i++) {
    var code = String(wanted[i]).toLowerCase().split('-')[0];
    if (code === 'no' || code === 'nn') code = 'nb';
    if (T[code]) { lang = code; break; }
  }
  var w = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' || lang === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('t').textContent = kind === 'play' ? w.pt : w.ut;

  // Google Play, naming who sent the link — the invite reward reads it.

  document.getElementById('get').href = play;

  // On Android: the app if it is installed, Google Play if it is not.

  if (!android || !ok(id)) { document.getElementById('open').href = play; return; }
